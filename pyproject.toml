[project]
name = "gits"
version = "0.0.1"
description = "G-I-T-S: a ghost with many shells"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

#: 只在 dream / synth / tests 里用。ghost 不许装（152 MB / 2.1 s，
#: 见 docs/research/stats-libs.md）。安装：uv pip install -e ".[dream]"
[project.optional-dependencies]
dream = ["statsmodels>=0.14"]

[project.scripts]
gits = "gits.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gits"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: 用本地资源压规模的测试，默认跳过"]
