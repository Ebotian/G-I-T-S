[project]
name = "gits"
version = "0.0.1"
description = "G-I-T-S: a ghost with many shells"
requires-python = ">=3.10"  # ECS 是 3.10.12，锁死下限
dependencies = ["numpy>=1.24"]

#: 按机器分层安装（docs/research/multi-node.md §6-7）：
#:   cloud   uv sync --extra ghost --extra dream
#:   office  uv sync --extra ghost --extra ml --extra dev
#: 每层都有实测内存/磁盘代价，见 docs/research/stats-libs.md
[project.optional-dependencies]
dream = ["statsmodels>=0.14"]
ml = ["onnxruntime>=1.18"]
dev = ["pytest>=8"]

[project.scripts]
gits = "gits.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gits"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: 用本地资源压规模的测试，默认跳过"]
