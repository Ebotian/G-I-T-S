[project]
name = "gits"
version = "0.0.1"
description = "G-I-T-S: a ghost with many shells"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
gits = "gits.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gits"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: 用本地资源压规模的测试，默认跳过"]
